services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reserva_medica
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
